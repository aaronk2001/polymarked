<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade lifecycle · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--rule:rgba(45,49,66,.12);--label-rule:rgba(45,49,66,.20);--lane:rgba(45,49,66,.018);--node:#fff;--node-stroke:rgba(45,49,66,.25);--chip:rgba(45,49,66,.12);--dot:rgba(45,49,66,.10);--db:#5e7a9b;--ls:#7c8f6f;--tb:#b8915a;--store:rgba(45,49,66,.05);--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1120px;width:100%}.diagram-container{width:100%;overflow-x:auto}.eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}svg{width:100%;min-width:960px;display:block}
    @media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
    svg text{font-family:var(--sans)}.mono{font-family:var(--mono)}.lane{fill:var(--lane)}.rule{stroke:var(--rule)}.label-rule{stroke:var(--label-rule)}.actor{fill:var(--muted);font:500 8px var(--mono);letter-spacing:.08em}.step-label{fill:var(--muted);font:500 6px var(--mono);letter-spacing:.12em}.step-chip{fill:var(--chip)}.step-num{fill:var(--ink);font:600 7px var(--mono)}.connector{fill:none;stroke:var(--muted);stroke-width:1}.connector.focal{stroke:var(--accent);stroke-width:1.2}.node-mask{fill:var(--paper)}.node{fill:var(--node);stroke:var(--node-stroke)}.node.store{fill:var(--store);stroke:var(--muted)}.node.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}.role{fill:rgba(45,49,66,.10)}.role.focal{fill:rgba(235,108,54,.25)}.role-text{fill:var(--ink);font:600 6px var(--mono)}.role-text.focal{fill:var(--accent)}.node-title{fill:var(--ink);font:600 9px var(--sans)}.node-sub{fill:var(--muted);font:6.5px var(--mono)}.node-tool{fill:var(--soft);font:6.5px var(--mono)}.data-text{fill:white;font:700 5px var(--mono)}.legend-key{fill:var(--muted);font:500 7px var(--mono);letter-spacing:.12em}.legend-text{fill:var(--muted);font:8px var(--sans)}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · PolyMarked</p>
    <h1>Trade lifecycle: ingest to settle</h1>
    <div class="diagram-container">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" aria-label="PolyMarked trade lifecycle from ingest to settle, with SQLite as the shared handoff" role="img" aria-labelledby="trade-lifecycle-title trade-lifecycle-desc">
      <title id="trade-lifecycle-title">Trade lifecycle: ingest to settle</title>
      <desc id="trade-lifecycle-desc">Process diagram of the PolyMarked trade lifecycle: the ingester snapshots the leaderboard into SQLite, scoring ranks wallets, the watcher turns followed-wallet activity into TradeDetected events, the executor decides and writes a paper fill to the paper ledger, and the app supervisor marks the ledger to market and settles resolved positions.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
      </defs>
      <rect width="960" height="600" fill="var(--paper)"/><rect width="960" height="600" fill="url(#dots)" opacity=".55"/>
      <rect class="lane" x="140" y="36" width="820" height="80"/>
      <rect class="lane" x="140" y="196" width="820" height="80"/>
      <rect class="lane" x="140" y="356" width="820" height="80"/>

      <line class="label-rule" x1="140" y1="36" x2="140" y2="516"/>
      <g class="actor" text-anchor="middle"><text x="70" y="72">SQLITE</text><text x="70" y="80">WAL</text><text x="70" y="160">INGESTER</text><text x="70" y="240">SCORING</text><text x="70" y="320">WATCHER</text><text x="70" y="400">EXECUTOR</text><text x="70" y="472">APP</text><text x="70" y="480">SUPERVISOR</text></g>
      <g text-anchor="middle"><rect class="step-chip" x="190" y="8" width="16" height="16" rx="8"/><text class="step-num" x="198" y="19">1</text><text class="step-label" x="198" y="32">INGEST</text><rect class="step-chip" x="302" y="8" width="16" height="16" rx="8"/><text class="step-num" x="310" y="19">2</text><text class="step-label" x="310" y="32">SCORE</text><rect class="step-chip" x="414" y="8" width="16" height="16" rx="8"/><text class="step-num" x="422" y="19">3</text><text class="step-label" x="422" y="32">WATCH</text><rect class="step-chip" x="526" y="8" width="16" height="16" rx="8"/><text class="step-num" x="534" y="19">4</text><text class="step-label" x="534" y="32">DECIDE</text><rect x="638" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="646" y="19" fill="var(--accent)" font-size="7" font-weight="600" class="mono">5</text><text x="646" y="32" fill="var(--accent)" font-size="6" font-weight="500" letter-spacing=".12em" class="mono">FILL</text><rect class="step-chip" x="750" y="8" width="16" height="16" rx="8"/><text class="step-num" x="758" y="19">6</text><text class="step-label" x="758" y="32">MARK</text><rect class="step-chip" x="862" y="8" width="16" height="16" rx="8"/><text class="step-num" x="870" y="19">7</text><text class="step-label" x="870" y="32">SETTLE</text></g>
      <!-- Connectors, drawn before nodes -->
      <path class="connector" d="M248 156 H282 Q290 156 290 148 V108" marker-end="url(#arrow)"/>
      <line class="connector" x1="330" y1="108" x2="330" y2="204" marker-end="url(#arrow)"/>
      <path class="connector" d="M360 236 H414 Q422 236 422 244 V284" marker-end="url(#arrow)"/>
      <path class="connector" d="M472 316 H526 Q534 316 534 324 V364" marker-end="url(#arrow)"/>
      <line class="connector focal" x1="584" y1="396" x2="596" y2="396" marker-end="url(#arrow-accent)"/>
      <path class="connector focal" d="M696 396 H730 Q738 396 738 388 V108" marker-end="url(#arrow-accent)"/>
      <line class="connector" x1="778" y1="108" x2="778" y2="444" marker-end="url(#arrow)"/>
      <line class="connector" x1="808" y1="476" x2="820" y2="476" marker-end="url(#arrow)"/>
      <!-- Nodes -->
      <g text-anchor="middle"><g><rect class="node-mask" x="148" y="124" width="100" height="64" rx="6"/><rect class="node" x="148" y="124" width="100" height="64" rx="6"/><rect class="role" x="152" y="128" width="20" height="10" rx="2"/><text class="role-text" x="162" y="136">ING</text><text class="node-title" x="198" y="150">Ingest</text><text class="node-sub" x="198" y="164">leaderboard → rows</text><text class="node-tool" x="198" y="176">snapshot_leaderboard</text><rect x="228" y="178" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="236" y="184">DB</text></g><g><rect class="node-mask" x="260" y="44" width="100" height="64" rx="6"/><rect class="node store" x="260" y="44" width="100" height="64" rx="6"/><rect class="role" x="264" y="48" width="20" height="10" rx="2"/><text class="role-text" x="274" y="56">SQL</text><text class="node-title" x="310" y="70">Snapshots</text><text class="node-sub" x="310" y="84">leaderboard_snapshot</text><text class="node-tool" x="310" y="96">wallet · follow</text></g><g><rect class="node-mask" x="260" y="204" width="100" height="64" rx="6"/><rect class="node" x="260" y="204" width="100" height="64" rx="6"/><rect class="role" x="264" y="208" width="20" height="10" rx="2"/><text class="role-text" x="274" y="216">SCR</text><text class="node-title" x="310" y="230">Score</text><text class="node-sub" x="310" y="244">rows → Smart Score</text><text class="node-tool" x="310" y="256">compute_smart_score</text><rect x="264" y="258" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="272" y="264">DB</text><rect x="340" y="258" width="16" height="8" rx="2" fill="var(--tb)"/><text class="data-text" x="348" y="264">TB</text></g><g><rect class="node-mask" x="372" y="284" width="100" height="64" rx="6"/><rect class="node" x="372" y="284" width="100" height="64" rx="6"/><rect class="role" x="376" y="288" width="20" height="10" rx="2"/><text class="role-text" x="386" y="296">WCH</text><text class="node-title" x="422" y="310">Watch</text><text class="node-sub" x="422" y="324">poll → TradeDetected</text><text class="node-tool" x="422" y="336">WalletWatcher</text><rect x="376" y="338" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="384" y="344">DB</text><rect x="452" y="338" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="460" y="344">DB</text></g><g><rect class="node-mask" x="484" y="364" width="100" height="64" rx="6"/><rect class="node" x="484" y="364" width="100" height="64" rx="6"/><rect class="role" x="488" y="368" width="20" height="10" rx="2"/><text class="role-text" x="498" y="376">EXE</text><text class="node-title" x="534" y="390">Decide</text><text class="node-sub" x="534" y="404">event → sized order</text><text class="node-tool" x="534" y="416">record_decision</text><rect x="488" y="418" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="496" y="424">DB</text><rect x="564" y="418" width="16" height="8" rx="2" fill="var(--ls)"/><text class="data-text" x="572" y="424">LS</text></g><g><rect class="node-mask" x="596" y="364" width="100" height="64" rx="6"/><rect class="node focal" x="596" y="364" width="100" height="64" rx="6"/><rect class="role focal" x="600" y="368" width="20" height="10" rx="2"/><text class="role-text focal" x="610" y="376">EXE</text><text class="node-title" x="646" y="390">Paper fill</text><text class="node-sub" x="646" y="404">order → virtual fill</text><text class="node-tool" x="646" y="416">write_paper_fill</text><rect x="600" y="418" width="16" height="8" rx="2" fill="var(--ls)"/><text class="data-text" x="608" y="424">LS</text><rect x="676" y="418" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="684" y="424">DB</text></g><g><rect class="node-mask" x="708" y="44" width="100" height="64" rx="6"/><rect class="node store" x="708" y="44" width="100" height="64" rx="6"/><rect class="role" x="712" y="48" width="20" height="10" rx="2"/><text class="role-text" x="722" y="56">SQL</text><text class="node-title" x="758" y="70">Paper ledger</text><text class="node-sub" x="758" y="84">paper_fill ledger</text><text class="node-tool" x="758" y="96">paper_equity curve</text></g><g><rect class="node-mask" x="708" y="444" width="100" height="64" rx="6"/><rect class="node" x="708" y="444" width="100" height="64" rx="6"/><rect class="role" x="712" y="448" width="20" height="10" rx="2"/><text class="role-text" x="722" y="456">APP</text><text class="node-title" x="758" y="470">Mark</text><text class="node-sub" x="758" y="484">fills → equity</text><text class="node-tool" x="758" y="496">equity-recorder task</text><rect x="712" y="498" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="720" y="504">DB</text><rect x="788" y="498" width="16" height="8" rx="2" fill="var(--tb)"/><text class="data-text" x="796" y="504">TB</text></g><g><rect class="node-mask" x="820" y="444" width="100" height="64" rx="6"/><rect class="node" x="820" y="444" width="100" height="64" rx="6"/><rect class="role" x="824" y="448" width="20" height="10" rx="2"/><text class="role-text" x="834" y="456">APP</text><text class="node-title" x="870" y="470">Settle</text><text class="node-sub" x="870" y="484">resolved → REDEEM</text><text class="node-tool" x="870" y="496">settlement task</text><rect x="824" y="498" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="832" y="504">DB</text></g></g>

</text><text class="legend-key" x="144" y="574">FLOW</text><line x1="200" y1="570" x2="228" y2="570" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text class="legend-text" x="240" y="574">Paper-fill handoff</text><line x1="360" y1="570" x2="388" y2="570" stroke="var(--muted)" marker-end="url(#arrow)"/><text class="legend-text" x="400" y="574">Sequential handoff</text><rect x="540" y="566" width="24" height="10" rx="2" fill="var(--store)" stroke="var(--muted)" stroke-width="1"/><text class="legend-text" x="576" y="574">SQLite table, shared handoff</text></g>
