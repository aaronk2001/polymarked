[project]
name = "polymarket-agent-watcher"
version = "0.1.0"
description = "Per-wallet activity polling + TradeDetected event emission. Phase 2."
requires-python = ">=3.11"
dependencies = [
    "polymarket-agent-core",
    "polymarket-agent-ingester",
    "apscheduler>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_agent_watcher"]
