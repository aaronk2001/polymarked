[project]
name = "polymarket-agent-api"
version = "0.1.0"
description = "FastAPI backend feeding the in-app dashboard. Localhost-only bind. Phase 5."
requires-python = ">=3.11"
dependencies = [
    "polymarket-agent-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_agent_api"]
