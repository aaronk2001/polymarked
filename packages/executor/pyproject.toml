[project]
name = "polymarket-agent-executor"
version = "0.1.0"
description = "Copy-trade order signing + posting via py-clob-client. DRY-RUN default. Phase 4."
requires-python = ">=3.11"
dependencies = [
    "polymarket-agent-core",
    "py-clob-client>=0.17",
    "web3>=6.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_agent_executor"]
