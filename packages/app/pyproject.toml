[project]
name = "polymarket-agent-app"
version = "0.1.0"
description = "Desktop entrypoint: tray icon + service supervisor."
requires-python = ">=3.11"
dependencies = [
    "polymarket-agent-core",
    "polymarket-agent-ingester",
    "polymarket-agent-watcher",
    "polymarket-agent-executor",
    "polymarket-agent-scoring",
    "polymarket-agent-api",
    "polymarket-agent-llm",
    "polymarket-agent-telegram-bot",
    "uvicorn>=0.30",
    "fastapi>=0.115",
    "pystray>=0.19",
    "pillow>=10.4",
    "pywebview>=5.3",
]

[project.scripts]
polymarked = "polymarket_agent_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_agent_app"]
