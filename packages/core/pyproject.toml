[project]
name = "polymarket-agent-core"
version = "0.1.0"
description = "Shared infrastructure for polymarket-agent: config, async DB, http, ORM, logging."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2.4",
    "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_agent_core"]
