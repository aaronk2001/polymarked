[project]
name = "polymarket-agent-telegram-bot"
version = "0.1.0"
description = "Owner-gated Telegram bot. Long polling. Phase 3."
requires-python = ">=3.11"
dependencies = [
    "polymarket-agent-core",
    "python-telegram-bot>=21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_agent_bot"]
