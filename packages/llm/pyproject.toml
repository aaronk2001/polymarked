[project]
name = "polymarket-agent-llm"
version = "0.1.0"
description = "Local Ollama wrapper for narration / explain / summary. Optional. Phase 1+."
requires-python = ">=3.11"
dependencies = [
    "polymarket-agent-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_agent_llm"]
